# Kalmido behind nginx (built-in login), e.g. /etc/nginx/conf.d/kalmido.conf. WebSockets are not needed;
# Kalmido uses plain HTTP with long polling (up to 60 s), hence the longer read timeout.
#
# 1. Get the certificate first: nginx refuses this file while the certificate files below are missing, so "certbot --nginx"
#    cannot run yet. The hooks stop nginx for a moment, now and at every renewal:
#      certbot certonly --standalone -d kalmido.example.com --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
# 2. Add this file, then: nginx -t && systemctl reload nginx
# 3. Let Kalmido believe nginx. Through the published port nginx arrives from the gateway of Kalmido's Compose network,
#    not from 127.0.0.1. Run this (the network is named after the install folder, "docker network ls" lists them):
#      docker network inspect kalmido_default --format '{{(index .IPAM.Config 0).Gateway}}'
#    put the address into .env and restart Kalmido (docker compose up -d kalmido):
#      KALMIDO_TRUSTED_PROXIES=127.0.0.1,::1,<that address>
#    Check: under Settings > Server > Server > Your IP you must see your public address, and that address as "Via proxy", trusted.
server {
    listen 80;
    listen [::]:80;
    server_name kalmido.example.com;
    return 301 https://$host$request_uri;
}

server {
    # works with every nginx. From 1.25.1 on nginx warns that this form is old: then write "listen 443 ssl;" (both lines)
    # and "http2 on;" (older versions do not know that line)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kalmido.example.com;

    ssl_certificate     /etc/letsencrypt/live/kalmido.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalmido.example.com/privkey.pem;

    # uploads: 4 x TASKS_MAX_FILE_MB (default 200 MB)
    client_max_body_size 200m;

    # Kalmido packs its scripts, styles and JSON itself; this also covers the rest (and a build without the packed copies)
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # long polling: agents and open apps wait up to 60 s for news
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # large uploads go straight through instead of being buffered on disk first
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3040;
    }

    # restoring a backup from a file: one request up to KALMIDO_BACKUP_MAX_MB (default 4096), and the restore runs inside
    # its request. Raise both when you raise that variable
    location = /api/admin/backups/upload {
        proxy_pass http://127.0.0.1:3040;
        client_max_body_size 4096m;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # the other backup paths: normal size, but a restore from an archive on the server takes as long
    location /api/admin/backups {
        proxy_pass http://127.0.0.1:3040;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

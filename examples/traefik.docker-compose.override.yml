# Kalmido behind Traefik 2 / 3 (built-in login), via Docker labels.
# Copy this file next to docker-compose.yml as docker-compose.override.yml (Compose reads it automatically) and adjust:
#   - "proxy" = the external Docker network Traefik is in (docker network create proxy, once)
#   - "websecure" = Traefik's HTTPS entry point, "letsencrypt" = its certificate resolver
#   - KALMIDO_TRUSTED_PROXIES in .env, so Kalmido believes Traefik's X-Forwarded-For / -Proto / -Host. In this setup Traefik
#     talks to the container directly and arrives from its own container address, not from a gateway. That address can
#     change when Traefik restarts, so name the network's range. Run this:
#       docker network inspect proxy --format '{{(index .IPAM.Config 0).Subnet}}'
#     put it into .env and restart Kalmido (docker compose up -d kalmido):
#       KALMIDO_TRUSTED_PROXIES=127.0.0.1,::1,<that range>
#     Every container in "proxy" is then believed: keep only containers you trust in it.
#     Check: under Administration > Server > Your IP you must see your public address, and Traefik's address as "Via
#     proxy", trusted.
# Installed with the installer? It may have written a docker-compose.override.yml already (first line "# generated by the
# Kalmido installer"), and this file replaces it: first copy its "image:" and "user:" lines into this file. The installer
# leaves this file alone from then on, and update.sh builds the image on this computer. update.sh also waits for
# 127.0.0.1:3040: remove the line "ports: !reset []" below (the port stays on localhost), or it waits 30 minutes and ends with
# "did not answer" although Kalmido runs. Or update by hand (README, *Updating*, the row of your install).
# WebSockets are not needed. Long polling (up to 60 s) works with Traefik's defaults. Large uploads do not: in Traefik 3
# respondingTimeouts.readTimeout of the entry point is 60 s by default and covers the whole request with its body, so an upload
# or a restored backup that takes longer breaks off. Set it on Traefik itself (static configuration), for example
#   --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1h
# Traefik sets no limit on the size of a request by itself.
services:
  kalmido:
    ports: !reset []   # Traefik reaches the container directly; nothing published on the host
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.kalmido.rule=Host(`kalmido.example.com`)
      - traefik.http.routers.kalmido.entrypoints=websecure
      - traefik.http.routers.kalmido.tls.certresolver=letsencrypt
      # Kalmido packs its scripts, styles and JSON itself; this also covers the rest
      - traefik.http.routers.kalmido.middlewares=kalmido-compress
      - traefik.http.middlewares.kalmido-compress.compress=true
      - traefik.http.services.kalmido.loadbalancer.server.port=3040

networks:
  proxy:
    external: true

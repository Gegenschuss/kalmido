name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, i18n, scanners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile app.py tools/*.py tests/*.py mcp/*.py
      - name: JavaScript syntax
        run: for f in static/*.js tests/*.js; do node --check "$f"; done
      - name: Translations complete
        run: python tools/i18n_check.py
      - name: MCP server + usage hook (stub API, no container)
        run: |
          python tests/mcp_test.py
          python tests/usage_hook_test.py
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: bandit (fails on high severity only)
        run: bandit -q --severity-level high -r app.py tools
      - name: pip-audit (pinned dependencies of the image)
        run: |
          grep -oE '[A-Za-z0-9_.-]+==[0-9][0-9A-Za-z.]*' Dockerfile > /tmp/requirements.txt
          cat /tmp/requirements.txt
          pip-audit --strict -r /tmp/requirements.txt

  semgrep:
    name: semgrep (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Known, reviewed false positives (see SECURITY.md) must not block the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config p/flask --config p/javascript --metrics=off --exclude tests app.py static tools

  tests:
    # 2.2.1: the suites run as 3 parallel shards (tests/run_all.sh --shard N/3, ~14 min each instead of ~42 min in one
    # job). fail-fast off: every shard reports its own failures. The job "Test suites" below needs all of them.
    name: Test suites ${{ matrix.shard }}/3 (API, UI, security)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Test dependencies
        run: |
          pip install -r tests/requirements.txt
          npm ci --prefix tests
      - name: Build image
        run: docker build -t kalmido:test .
      - name: Run all suites
        env:
          TZ: Europe/Berlin
          PYTHON: python
        run: tests/run_all.sh --shard ${{ matrix.shard }}/3
      - name: Container log on failure
        if: failure()
        run: docker logs kalmido-test 2>&1 | tail -100 || true

  tests-done:
    # one required check for all shards (branch protection / the overall result): green only if every shard passed
    name: Test suites (API, UI, security)
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    timeout-minutes: 5
    steps:
      - run: |
          echo "shards: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"

  zap:
    name: OWASP ZAP baseline (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Start Kalmido
        run: |
          docker build -t kalmido:test .
          mkdir -p /tmp/zapdata
          docker run -d --name kalmido-zap --user "$(id -u):$(id -g)" -e KALMIDO_UPDATE_CHECK=0 -e TASKS_DB=/data/tasks.db \
            -p 127.0.0.1:3040:3040 -v /tmp/zapdata:/data kalmido:test
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3040/api/health && break; sleep 1; done
      - name: ZAP baseline scan (unauthenticated)
        run: |
          docker run --rm --network host ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3040/ -I

name: CI

on:
  push:
    # 2.285.0 (#2830): + hotfix/** = the fast lane of the live train (a patch on the last live tag, beside main); the
    # concurrency group hangs on github.ref, so a hotfix push and a push on main never cancel each other; tests/stages.py
    # gives a hotfix branch the full stage, the suite times still come from main (--branch main below)
    # 2.556 (#4388): job/** (2.321, #1368) is gone - since the trunk (02.11.2026) the release tooling pushes only main and
    # hotfix branches
    branches: [main, "hotfix/**"]
  pull_request:
  # #4006 (GitHub step 3 of 6, decision 29.10.2026): an entry of the merge queue runs the push stage like a pull request
  # (tests/stages.py: against the queue's base commit); the release commit (VERSION changed) still gets the full run there.
  # The job "pr-lint" checks the commits of a pull request / queue entry. The concurrency group hangs on github.ref: every
  # queue entry has its own gh-readonly-queue/... ref, so entries never cancel each other.
  merge_group:
    types: [checks_requested]
  # 2.180.0 A (#2695): the nightly full run (23:30 UTC = 01:30 / 00:30 in Berlin, the window of the night flakes) and runs by
  # hand (stage full by default); both in their own concurrency group: a push never cancels them, they never cancel a push
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "full = every suite, push = the push stage of the last commit"
        type: choice
        options: [full, push]
        default: full

permissions:
  contents: read

# landings on main replace each other; 2.556 (#4388): the own group of the "[release]" cut commit (2.321, #1368) is gone - the
# trunk has no such commit any more
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('ci-{0}-{1}', github.event_name, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

# 2.179 (#2691): one wave. GitHub runs about 20 jobs of the account at once. "plan" cuts the shards from the suite times of the
# last finished runs (tools/shards.py, LPT). #1315 (25.10.2026): Lint, e-invoice, demo, semgrep and ZAP start at once beside
# "plan" and the image (all done in ~3-5 min, when the shards start), so 20 shards fit; no rerun - a red suite is red, a
# proven flaky one is skipped with a date and a task (tests/skip.txt, checked by tests/skip_test.py).
# 2.180.0 A (#2695): two stages, chosen by "plan" (tests/stages.py): "full" = every suite (nightly, by hand, a push that
# changes VERSION = the release push before every live update, a change of the CI basics, "[full]" in the commit message);
# "push" = the security / rights / tenant / org / freelancer suites, the core flows and the suites of the touched areas
# (pull requests, pushes on main without a release), in as many shards as ~15 min each need. The shard jobs are named
# "Test suites <N>/<M> <stage> (API, UI, security)": the stage of a green run is readable from the job names.
# #4557 (04.11.2026): the groups of the hard areas (office, invoices, backup, login: tests/hard_suites.txt) get their own shards
# 1..H of ~9 min each (tools/shards.py --hard-target-min), the first entries of the matrix, so they are queued before the others;
# their jobs are named "Test suites <N>/<M> <stage> hart (API, UI, security)". A release in the fast lane waits for these only.
jobs:
  plan:
    name: Shard plan (stage, suite times of the last runs)
    runs-on: ubuntu-latest
    # CI fix of 2.351.0: 8 instead of 5 min; tests/stages.py (150 s) and each download of suite times (60 s) have their own
    # limit below, so a slow step costs a full run instead of a cancelled plan (a cancelled plan skips every shard)
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      hard: ${{ steps.plan.outputs.hard }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 2.180.0 A (#2695): the parent of HEAD for the changed files; 2.321 (#1368): the merge base with main for job/** branches
      - name: Stage (full / push) and the groups of the push stage (tests/stages.py)
        id: stage
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_INPUT_STAGE: ${{ inputs.stage }}
          CI_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event.merge_group.head_commit.message }}
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha }}  # #4006: the queue entry's base (the target branch before it)
        run: |
          # 2.321 (#1368): a package branch (job/**) is tested against its merge base with main (tests/stages.py fetches main)
          # CI fix of 2.351.0: stages.py searched 6+ min for the 204 files of a live train push and the job limit cancelled the
          # plan; now it decides in seconds, the 150 s limit turns a slow run into the full stage
          out=$(timeout 150 python3 tests/stages.py --ci --groups-out /tmp/push-groups.txt) || out=$'stage=full\nreason=tests/stages.py failed or took over 150 s - full run'
          stage=$(sed -n 's/^stage=//p' <<<"$out"); reason=$(sed -n 's/^reason=//p' <<<"$out")
          if [ "$stage" = push ] && ! [ -s /tmp/push-groups.txt ]; then stage=full; reason="no groups for the push stage - full run"; fi
          [ "$stage" = push ] || stage=full
          { echo "stage=$stage"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
      # 2.166.0 CI fix: the times of the last THREE finished runs, the newer wins per group (tools/shards.py: the last file
      # wins). With one run only, the groups a shard did not reach (cancelled at the 45 min limit) counted as 20 s per
      # suite: 2.166.0 planned such groups onto shards 1 and 3 and both ran into the limit again
      - name: Suite times (the last three finished runs, back to the last full one; artifacts timings-shard-*)
        env:
          GH_TOKEN: ${{ github.token }}
        # 2.180.0 A (#2695): a push stage run has times of its groups only: the runs newest first until at least three and the
        # first full one are in (at most 6; runs before 2.180 have no timings-stage.txt and were full); shards.py reads them
        # oldest first, a later time wins
        run: |
          mkdir -p /tmp/timings; order=; n=0; full=
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status completed --limit 30 \
                  --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][:6][].databaseId' || true)
          for id in $ids; do
            timeout 60 gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'timings-shard-*' -D "/tmp/timings/$id" || { echo "run $id: no timings"; continue; }
            st=$(cat /tmp/timings/"$id"/*/timings-stage.txt 2>/dev/null | sed -n 1p || true)
            echo "run $id: stage ${st:-full (no stage file)}"
            # #4327: not the shards cancelled at their time limit: the group they were in is cut off and the newest time wins in
            # shards.py, so the next plan runs into the limit again (same rule as keep_times of the Mac runner). A full run with
            # such a shard does not end the way back: the groups it never reached need the times of an older run
            cut=$(timeout 60 gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs | python3 tools/shards.py --cut-shards -) || { echo "run $id: no job list, times not used"; continue; }
            for s in $cut; do rm -rf "/tmp/timings/$id/timings-shard-$s"; echo "run $id: shard $s was cancelled, its times are not used"; done
            order="$id $order"; n=$((n + 1))
            [ "${st:-full}" = full ] && [ -z "$cut" ] && full=1
            [ -n "$full" ] && [ "$n" -ge 3 ] && break
          done
          printf '%s\n' $order > /tmp/timings/order.txt
          echo "runs (oldest first): ${order:-none - estimates only}"
      - name: Plan (full H hard + 20 others, push stage ~15 min per shard, hard shards first ~9 min)
        id: plan
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          REASON: ${{ steps.stage.outputs.reason }}
        run: |
          t=$(while read -r id; do [ -z "$id" ] || find "/tmp/timings/$id" -name timings.csv; done < /tmp/timings/order.txt)
          stage=$STAGE
          if [ "$stage" = push ]; then
            python3 tools/shards.py --shards 20 --only /tmp/push-groups.txt $t | sed -n 1p || true
            python3 tools/shards.py --shards 20 --target-min 15 --hard-target-min 9 --only /tmp/push-groups.txt --assign $t > shard-plan.txt \
              || { stage=full; REASON="push stage plan failed - full run"; }
          fi
          if [ "$stage" = full ]; then
            # job/2398 (CI of 2.493.0): 20 fixed shards had grown to a 37-min plan, two shards hit the 50-min limit with every
            # suite green - the full run now takes as many shards as 30 min each need (at most 28; above 20 they queue)
            # #4557: + the hard groups on their own shards 1..H (~9 min each, at most 8) in front of the 28
            # 2.556 (#4388): 28 + H queued (GitHub runs ~20 at once: the rest waited 27-34 min, a run took ~70 min) - now
            # exactly 20 in all (H hard + 20-H others), the times still from the measured runs, limit 60 min (job "tests"; 90 since job/2867)
            # #4748 (CI v2.563.1): with 20 in all the 13 others ran 80-84 of their 90 min, the 7 hard ones only 7-13 - now H hard
            # + exactly 20 others: the H queued others start when the hard ones end (~10 min), each holds ~2/3 of the old time
            python3 tools/shards.py --soft-shards 20 --hard-target-min 9 $t | tail -6
            python3 tools/shards.py --soft-shards 20 --hard-target-min 9 --assign $t > shard-plan.txt
          fi
          test -s shard-plan.txt
          n=$(awk '!/^#/ && $2 > m {m = $2} END {print m + 0}' shard-plan.txt)
          test "$n" -ge 1
          # #4557: "# hard H" = shards 1..H hold the hard groups; the matrix lists them first, their job name says "hart"
          h=$(sed -n 's/^# hard \([0-9][0-9]*\)$/\1/p' shard-plan.txt | sed -n 1p); h=${h:-0}
          test "$h" -lt "$n" || h=0
          matrix=$(python3 -c 'import json, sys; n, h = map(int, sys.argv[1:]); print(json.dumps([{"shard": k, "hart": " hart" if k <= h else ""} for k in range(1, n + 1)]))' "$n" "$h")
          { echo "stage=$stage"; echo "count=$n"; echo "shards=[$(seq -s, 1 "$n")]"; echo "hard=$h"; echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
          echo "::notice title=stage::$stage - $n shards ($h hard first), $(grep -vc '^#' shard-plan.txt) groups - ${REASON//%/%25}"
          { echo "### Test stage: $stage ($n shards, $h of them hard first)"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-plan
          path: shard-plan.txt
          retention-days: 7

  image:
    # 2.180.0 A (#2692): the app image once per content of its build inputs (the Dockerfile and what it copies: app.py,
    # VERSION, kalmido/, static/) and per week (fresh base image and Debian packages): built once, kept in the Actions
    # cache (docker save, compressed by the cache). The shards and ZAP do not wait for this job (it would put the image
    # build in front of every shard): they restore the image when it is there (nightly run, pushes of tests only, a rerun,
    # and the shards of a cache miss that start after this job has saved it) and build it themselves otherwise, as before.
    # The cache rather than an artifact: shared across runs, nothing to download when it misses; a failed save only costs
    # the next run its own builds.
    name: Image (build once, cache)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image key (build inputs + week)
        id: key
        run: echo "key=kalmido-image-$(date -u +%G-%V)-${{ hashFiles('Dockerfile', 'tools/requirements.lock', 'tools/requirements.static.lock', 'app.py', 'VERSION', 'kalmido/**', 'static/**', 'folderwatch/**') }}" >> "$GITHUB_OUTPUT"
      - name: Image in the cache?
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/kalmido-image
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Build + save the image (not in the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build -t kalmido:test .
          mkdir -p /tmp/kalmido-image
          docker save -o /tmp/kalmido-image/kalmido-test.tar kalmido:test
          ls -l /tmp/kalmido-image
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/kalmido-image
          key: ${{ steps.key.outputs.key }}

  checks:
    name: Lint, i18n, scanners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/.node-version  # 2.360.3 (#2916): the same Node as the test runner, Node 20 has no support any more
      - name: Python syntax
        run: python -m py_compile app.py $(find kalmido -name '*.py') tools/*.py tests/*.py mcp/*.py
      - name: JavaScript syntax
        run: for f in static/*.js static/js/*.js tests/*.js tools/demo/*.js; do node --check "$f"; done
      # 2.102.0 (#1995): tsc as a check only (no build, nothing emitted, pinned version); it checks the files that start with
      # // @ts-check, every new client file must (tools/check_tscheck.py)
      - name: Type check of the client (files with // @ts-check)
        run: python tools/check_tscheck.py && npx --yes -p typescript@6.0.3 tsc -p jsconfig.json
      # 2.126.0 (#1993): ESLint as a check only (pinned version, eslint.config.mjs; no-undef, no-unused-vars, eqeqeq). 2.321 (#1368):
      # the list of the client's global names (tools/eslint_globals.json) is generated here, not kept in git (exit 1 = a name
      # declared twice)
      - name: ESLint of the client
        run: python tools/eslint_globals.py && npx --yes eslint@10.13.0 static/i18n.js 'static/js/*.js' static/sw.js
      # 2.191.0 B (#1824): JS / CSS go out without comments (kalmido/core/strip.py); every client file stripped, node --check,
      # tokens before / after compared with the tokenizer of the pinned ESLint (only comments may differ)
      - name: Comment remover of the static files
        run: npx --yes -p eslint@10.13.0 -c "python tools/strip_check.py -v --need-espree"
      # 2.653.0 (#5087): check_layout.py runs tools/check_touch_switch.py too (finger operation on isTouchUi(), not on isMobile())
      - name: Module lists agree (index.html / sw.js / static/js, kalmido/__init__.py / the package)
        run: python tools/check_layout.py
      # 2.742.0 (#5217): the web manifest (tools/web_manifest.py, the full SHA-256 of every file the browser gets) built twice, in two
      # fresh processes from two copies of the tree - any difference stops the run (the release attaches it per version)
      - name: Web manifest reproducible (built twice independently)
        run: python tools/web_manifest.py --twice -o /tmp/web-manifest.json
      # 2.380 G (#3390): the hashes the server sends to the agent setup match the starter files
      - name: Starter file hashes (mcp/starter_sha256.txt)
        run: python tools/starter_sha.py --check
      # 2.149.0 F (#2519): a start file calls a function of a module loaded on demand only guarded (a fresh device has not
      # loaded it yet), and every var(--x) without a fallback is defined
      - name: Calls into modules loaded on demand are guarded, CSS variables defined
        run: python tools/check_lazy_calls.py -v
      - name: Server layers (module-level imports only from the own or a lower layer)
        run: python tools/check_layers.py -v
      # 2.521.0 (#4391): red only over a ceiling (decke_* in tools/perf_budget.json); the growth per package is measured by the train
      - name: Performance budget
        run: python tools/perf_budget.py
      - name: Environment variables declared and documented (kalmido/core/env.py, docs/ENV.md)
        run: python tools/env_check.py
      - name: Links and anchors between the Markdown pages (2.277, #3055)
        run: python tools/check_links.py -v
      - name: Menu paths in the docs and the app's texts name settings that exist (2.512.0, #4175)
        run: python tools/check_menupaths.py -v
      - name: One data attribute, one meaning - or a guard in the document click listener (2.525.0, #4281)
        run: python tools/check_dataattr.py -v
      - name: New tables, columns and indexes in migrations.d, not schema.py (2.475.0, #3478)
        run: python tools/check_migrations.py -v
      - name: Modules a test loads as a single file still load that way (2.493.0, #4041)
        run: python tools/check_singlefile.py
      - name: No unescaped value through tr() / trn() into HTML - trh() / trnh() (2.689.0, #5125)
        run: python tools/check_trh.py
      - name: Every table with people's data is exported or named (2.362.4, #3107)
        run: python tools/check_export_tables.py
      - name: Every new *_id column has a foreign key or a 'no FK' marker (2.755.0, #5261)
        run: python tools/check_fk_comment.py
      - name: No check in tests/ that cannot fail (2.755.0, #5261)
        run: python tools/check_nosham.py
      - name: Links, tags, comments, read marks, versions, following only in the shared core (2.755.0, #5267)
        run: python tools/check_core_crosscut.py
      - name: New columns with real types - TIMESTAMPTZ, BOOLEAN, JSONB (2.755.0, #5305)
        run: python tools/check_coltypes.py
      - name: ruff (E, F, BLE without E501; ruff.toml) red for new code only - tools/ruff_baseline.json (2.755.0, #5294)
        run: |
          pip install ruff==0.17.4
          ruff check --output-format json --exit-zero . > /tmp/ruff.json
          python tools/ruff_baseline.py /tmp/ruff.json
      - name: Translations complete
        run: |
          python tools/i18n_check.py
          python tests/i18n_test.py
      - name: MCP server + usage hook (stub API, no container)
        run: |
          python tests/mcp_test.py
          python tests/usage_hook_test.py
      - name: New agents (launcher parity, agent docs coverage)
        run: |
          python tests/launcher_parity_test.py
          python tests/agent_docs_coverage_test.py
      - name: Skipped flaky suites (tests/skip.txt well formed, no date passed) (#1315)
        run: python tests/skip_test.py
      # 2.360.3 (#2915): base images by digest, installs with hashes, CI tools with a version, pdf.js against OSV (no lock file sees it)
      - name: Pinned dependencies stay pinned
        run: python tools/pins.py --osv
      - name: Install scanners
        run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: bandit (fails on high severity only)
        run: bandit -q --severity-level high -r app.py kalmido tools
      # 2.360.3 (#2915): the lock files are the complete lists (sub-packages and tzdata too), nothing read from the Dockerfile any more
      - name: pip-audit (image and embedding service)
        run: |
          pip-audit --strict --disable-pip --require-hashes -r tools/requirements.lock
          pip-audit --strict --disable-pip --require-hashes -r tools/requirements.static.lock
          pip-audit --strict --disable-pip --require-hashes -r embed/requirements.lock
      # 2.360.3 (#2915): nothing of tests/ ships, so a finding there is reported without stopping the build
      - name: pip-audit of the test tools (informational)
        continue-on-error: true
        run: pip-audit --strict -r tests/requirements.txt
      - name: npm audit of the test tools (informational)
        continue-on-error: true
        run: npm audit --omit=optional --prefix tests

  einvoice:
    # 2.38.0 (#1021 P5): the e-invoice files Kalmido writes pass the real validators -- veraPDF (PDF/A-3b) and the KoSIT
    # validator (EN 16931 / XRechnung Schematron); tests/office_einvoice_test.py writes the files, tools/einvoice_validate.sh
    # checks them (blocking)
    # 2.546.0 B (#4289): also the files of the real finalising (tests/p2546_b_einvoice_api_test.py starts the server with the
    # app image, makes the invoices through its routes and takes the stored PDF + XML), with a minimum number of them
    name: E-invoice validators (veraPDF, KoSIT)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 2.546.0 B (#4289): was 15; the image build on a cache miss comes on top
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Validator cache (KoSIT jar + XRechnung configuration)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kalmido-validators
          key: kalmido-validators-${{ hashFiles('tools/einvoice_validate.sh') }}
      - name: Test dependencies
        run: pip install -r tests/requirements.txt
      # 2.546.0 B (#4289): the image of the job "image" (same key) when it is in the cache, else built here (as the shards)
      - name: Image key
        id: imgkey
        run: echo "key=kalmido-image-$(date -u +%G-%V)-${{ hashFiles('Dockerfile', 'tools/requirements.lock', 'tools/requirements.static.lock', 'app.py', 'VERSION', 'kalmido/**', 'static/**', 'folderwatch/**') }}" >> "$GITHUB_OUTPUT"
      - name: Image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: /tmp/kalmido-image
          key: ${{ steps.imgkey.outputs.key }}
      - name: Image (load, build on miss)
        run: |
          if [ -s /tmp/kalmido-image/kalmido-test.tar ] && docker load -i /tmp/kalmido-image/kalmido-test.tar \
             && docker image inspect kalmido:test >/dev/null; then
            echo "image loaded from the cache"
          else
            echo "image not in the cache (or not loadable) - building it"
            docker build -t kalmido:test .
          fi
          rm -rf /tmp/kalmido-image
      - name: Write the e-invoice files (XML + PDF/A-3)
        run: |
          python tests/office_pdf_test.py
          python tests/office_einvoice_test.py
          python tests/p2154_b_ubl_test.py  # 2.154.0 B (#1960): UBL (Peppol BIS 3.0, XRechnung UBL, EN 16931), after the CII files
          python tests/p2296_a_pdfa_test.py  # 2.296.0 A (#3178): logo, 16-bit logo, letterhead, draft mark + special characters, long footer
          python tests/p2354_a_einvoice_test.py  # 2.354.0 A (#2831, #2833): exact unit prices, a taxed invoice with a stale reverse charge key
          python tests/p2357_l_einvoice_test.py  # 2.357.0 (#3217, #3218): zero rated Z, O with the tax number as seller id
          python tests/p2357_a_paper_pdf_test.py  # 2.357.0 A (#3156): US-Letter invoice with e-invoice, on a letterhead, draft
          python tests/p2355_c_einvoice_test.py  # 2.355.0 C (#2844): categories K (goods to the EU, deliver-to address) and G (export)
          python tests/p2408_a_einvoice_test.py  # 2.408.0 A (#3520): final invoice after the BMF letter of 15.10.2026 (BT-113 + BT-22), CII + UBL
          python tests/p2424_c_einvoice_test.py  # 2.424.0 C (#3524): ZUGFeRD 2.5.2 points (credit note, progress / final invoice, AE) - 2.546.0 B (#4289)
          # 2.546.0 B (#4289): the real finalising through the server (19 / 7 %, discount, reverse charge, credit note, personal office);
          # its server data in its own folder (start.sh wipes the data dir, the files go to tests/.data/einvoice/real-*)
          python tests/p2546_b_einvoice_api_test.py "$RUNNER_TEMP/einvoice-api-data"
      - name: "At least 14 files from the real finalising (2.546.0 B, #4289)"
        run: |
          ls -l tests/.data/einvoice/real-* || true
          pdf=$(ls tests/.data/einvoice/real-*.pdf 2>/dev/null | wc -l); xml=$(ls tests/.data/einvoice/real-*.xml 2>/dev/null | wc -l)
          echo "real finalising: $pdf PDF, $xml XML"
          [ "$pdf" -ge 7 ] && [ "$xml" -ge 7 ] || { echo "::error title=e-invoice files::too few files from the real finalising ($pdf PDF, $xml XML; at least 7 + 7)"; exit 1; }
      - name: veraPDF + KoSIT
        run: tools/einvoice_validate.sh tests/.data/einvoice/*.pdf tests/.data/einvoice/*.xml
      - name: Reports on failure
        if: failure()
        run: for f in ~/.cache/kalmido-validators/reports/*-report.xml; do echo "== $f"; grep -oE 'rep:message[^>]*>[^<]*' "$f" | head -30; done 2>/dev/null || true
      - name: "Container log on failure (2.546.0 B, #4289)"
        if: failure()
        run: docker logs kalmido-test 2>&1 | tail -100 || true

  demo:
    # 2.12.0 (#436): the browser demo builds from the current sources and runs without a server (jsdom smoke test + Firefox
    # layout when the runner has one), and quick add understands all six languages (on the demo build, no container)
    name: Browser demo + quick add languages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/.node-version  # 2.360.3 (#2916): the same Node as the test runner, Node 20 has no support any more
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Test dependencies
        run: npm ci --prefix tests
      - name: Build the demo
        run: python tools/build_demo.py /tmp/kalmido-demo && test -f /tmp/kalmido-demo/index.html
      # 2.501.0 (#4296): without Firefox every suite with a browser part is red (tests/ff.js): say why at once, not suite by suite
      - name: Firefox is there
        run: firefox --version || { echo "::error title=no Firefox::the runner image has no firefox, the UI suites cannot run"; exit 1; }
      - name: Demo smoke test (jsdom, Firefox)
        env:
          TZ: Europe/Berlin
          PYTHON: python
        run: cd tests && node demo_test.js
      - name: Office in the demo (2.74.0, #1653)
        env:
          TZ: Europe/Berlin
          PYTHON: python
        run: cd tests && node p274_b_demo_test.js
      - name: Quick add in six languages
        env:
          TZ: Europe/Berlin
          PYTHON: python
        run: cd tests && node quick_lang_test.js

  windows-launcher-changes:
    # 2.609.0 (#3660, decided 23.10.2026): the Windows launcher runs only when mcp/ changed (a Windows runner costs minutes):
    # pull request = against its base, push = against the push's "before"; nightly / by hand always; no base to compare
    # (a new branch, a rewritten history) = run. Skipped = "skipped", the required "Test suites" check does not need it.
    name: Windows launcher needed (mcp/ changed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the base of the comparison
      - name: Changed files under mcp/
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=${BASE:-$BEFORE}
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then run=true; why="$EVENT: always"
          elif [ -z "$from" ] || [ -z "${from//0/}" ] || ! files=$(git diff --name-only "$from" "$GITHUB_SHA" 2>/dev/null); then
            run=true; why="no base to compare with - run"
          elif grep -qE '^mcp/|^tests/p2609_d_winlauncher_test\.py$' <<<"$files"; then run=true; why="mcp/ changed"
          else run=false; why="nothing under mcp/ changed"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice title=windows launcher::$run - $why"

  windows-launcher:
    # 2.609.0 (#3660): mcp/agent_launcher.ps1 on Windows for real: a stub API as the throwaway instance (no Kalmido server on
    # Windows), a stand-in for claude; start, one event worked off, a pause ends the tree, launcher_gone after a hard kill
    # (tests/p2609_d_winlauncher_test.py), once with PowerShell 7 and once with Windows PowerShell 5.1
    name: Windows launcher (agent_launcher.ps1, stub API, stand-in for claude)
    needs: windows-launcher-changes
    if: needs.windows-launcher-changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Time zone data (Windows has none for zoneinfo; tests/kt.py needs it)
        run: python -m pip install tzdata==2025.2
      - name: PowerShell 7 (pwsh)
        env:
          PWSH: pwsh
        run: python tests/p2609_d_winlauncher_test.py
      - name: Windows PowerShell 5.1
        if: always()
        env:
          PWSH: powershell.exe
        run: python tests/p2609_d_winlauncher_test.py

  semgrep:
    # 2.543.0 (#4625): red for NEW findings only (2.755.0, #5296: plus the own rule .semgrep/sql_ident.yml, qi()). The known, reviewed findings stand in tools/semgrep_baseline.json (rule, file,
    # code line, reason, date; SECURITY.md "Scanner exception lists"); tools/semgrep_baseline.py compares the JSON output
    # against it. A real gap gets a task and is fixed, not only listed.
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.183.0
      - name: semgrep scan
        run: semgrep scan --config p/python --config p/flask --config p/javascript --config .semgrep/sql_ident.yml --metrics=off --exclude tests --exclude static/vendor --json --output /tmp/semgrep.json app.py kalmido static tools
      - name: New findings against the exception list
        run: python3 tools/semgrep_baseline.py /tmp/semgrep.json

  tests:
    # 2.2.1: the suites run as parallel shards (2.7.1: 4, 2.15.1: 5, 2.16.0: 6, 2.18.0: 7, 2.30.0: 8, 2.37.1: 9, 2.40.0: 10, 2.80.2: 11, 2.80.3: 12, 2.84.0 + 2.80.3: 13, 2.124.2: 17, 20.10.2026: 19, 22.10.2026: 21, 2.179: 18 cut by the job "plan" from the measured suite times instead of the
    # `shard N` markers of run_all.sh, tests/run_all.sh --shard N/18 with KALMIDO_SHARD_PLAN). fail-fast off: every shard
    # reports its own failures. The job "Test suites" below needs all of them. 2.180.0 A (#2695): the number of shards and the
    # stage come from "plan" (full: 20 since #1315; push: fewer)
    # #4557: "hart" after the stage for the shards of the hard groups (the release tooling's fast lane waits for those)
    name: Test suites ${{ matrix.shard }}/${{ needs.plan.outputs.count }} ${{ needs.plan.outputs.stage }}${{ matrix.hart }} (API, UI, security)
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 90  # 2.80.1: four shards ran into the 30 min limit on a slow runner; CI of 2.166.1 (#945): 50 as a safety net (#1315: 20 shards, the plan aims at ~30 min per shard); 2.556 (#4388): 60 with 20 fixed shards
    # CI red v2.560.0 (job/2867): the first full run with 20 fixed shards had 7 hard shards (~9 min) and 13 others - all 13 hit
    # the 60 min limit ("exceeded the maximum execution time"), their suites never finished. The other suites need ~900 shard
    # minutes (CI v2.551.0: 28 shards, 914 min) = ~70 min each on 13 shards; 90 leaves room, the plan stays at 20 (#4388)
    strategy:
      fail-fast: false
      # #4557: [{shard, hart}] in shard order - the hard shards 1..H first, so they are queued before the others
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tests/.node-version  # 2.360.3 (#2916): the same Node as the test runner, Node 20 has no support any more
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Test dependencies
        run: |
          pip install -r tests/requirements.txt
          npm ci --prefix tests
      # 2.180.0 A (#2692): the image of the job "image" (same key) when it is in the cache, else built here
      - name: Image key
        id: imgkey
        run: echo "key=kalmido-image-$(date -u +%G-%V)-${{ hashFiles('Dockerfile', 'tools/requirements.lock', 'tools/requirements.static.lock', 'app.py', 'VERSION', 'kalmido/**', 'static/**', 'folderwatch/**') }}" >> "$GITHUB_OUTPUT"
      - name: Image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: /tmp/kalmido-image
          key: ${{ steps.imgkey.outputs.key }}
      - name: Image (load, build on miss)
        run: |
          if [ -s /tmp/kalmido-image/kalmido-test.tar ] && docker load -i /tmp/kalmido-image/kalmido-test.tar \
             && docker image inspect kalmido:test >/dev/null; then
            echo "image loaded from the cache"
          else
            echo "image not in the cache (or not loadable) - building it"
            docker build -t kalmido:test .
          fi
          rm -rf /tmp/kalmido-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: /tmp/plan
      # 2.501.0 (#4296): without Firefox every suite with a browser part is red (tests/ff.js): say why at once, not suite by suite
      - name: Firefox is there
        run: firefox --version || { echo "::error title=no Firefox::the runner image has no firefox, the UI suites cannot run"; exit 1; }
      - name: Run all suites
        env:
          TZ: Europe/Berlin
          PYTHON: python
          KALMIDO_SHARD_PLAN: /tmp/plan/shard-plan.txt
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          STAGE: ${{ needs.plan.outputs.stage }}
        # #1315 (25.10.2026): no rerun - a suite red once is red (a proven flaky one is in tests/skip.txt until its date)
        run: |
          echo "$STAGE" > tests/timings-stage.txt
          tests/run_all.sh --shard "$SHARD"
      - name: Suite timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-shard-${{ matrix.shard }}
          path: tests/timings*
          if-no-files-found: ignore
          retention-days: 30
      # 2.625 D (#4005): one JUnit report per suite (tests/run_all.sh -> tests/.junit/<suite>.xml); the flaky detection of the
      # release tooling reads which suite / which case was red (kalmido-ci-status.py junit)
      - name: JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-shard-${{ matrix.shard }}
          path: tests/.junit/*.xml
          if-no-files-found: ignore
          retention-days: 30
      - name: Container log on failure
        if: failure()
        run: docker logs kalmido-test 2>&1 | tail -100 || true

  # #4006: the checks einreihen makes before a package lands, on the commits of a pull request / merge queue entry
  # (tools/pr_lint.py): #<task> in every commit subject, the changelog part of an app change, the privacy guard (patterns
  # and allowed identities from the secrets - they are private themselves; a fork's pull request gets none: notice) and the
  # one-way rules as warnings. A required check of the branch protection later (step 4); runs only on pull_request / merge_group.
  pr-lint:
    name: Pull request lint (task number, changelog part, privacy, one-way steps)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commits between the base and the head
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint of the change (tools/pr_lint.py)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          KALMIDO_PRIVACY_DENY: ${{ secrets.KALMIDO_PRIVACY_DENY }}
          KALMIDO_PRIVACY_ALLOW: ${{ secrets.KALMIDO_PRIVACY_ALLOW }}
          KALMIDO_PRIVACY_IDENT: ${{ secrets.KALMIDO_PRIVACY_IDENT }}
          KALMIDO_ALLOWED_EMAILS: ${{ secrets.KALMIDO_ALLOWED_EMAILS }}
        # review F9: the script comes from the BASE commit (the target branch), never from the change itself - a queue entry of
        # a pull request that edits tools/pr_lint.py runs with the secrets, its own copy could print them. Without the script in
        # the base (the change that brings it) the change's copy runs without the secrets (no line scan, a notice).
        run: |
          if git cat-file -e "$PR_BASE:tools/pr_lint.py" 2>/dev/null; then
            git show "$PR_BASE:tools/pr_lint.py" > "$RUNNER_TEMP/pr_lint.py"
            python "$RUNNER_TEMP/pr_lint.py" --repo "$GITHUB_WORKSPACE" --base "$PR_BASE" --head "$PR_HEAD"
          else
            env -u KALMIDO_PRIVACY_DENY -u KALMIDO_PRIVACY_ALLOW -u KALMIDO_PRIVACY_IDENT -u KALMIDO_ALLOWED_EMAILS \
              python tools/pr_lint.py --base "$PR_BASE" --head "$PR_HEAD"
          fi

  tests-done:
    # one required check for all shards (branch protection / the overall result): green only if every shard passed
    name: Test suites (API, UI, security)
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    timeout-minutes: 5
    steps:
      - run: |
          echo "shards: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"

  zap:
    # 2.543.0 (#4625): red for NEW alerts only. .zap/rules.tsv names the reviewed alerts (IGNORE with the reason and date,
    # SECURITY.md "Scanner exception lists"); the scan runs without -I, so every other alert fails the job.
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL
        # 2.37.0: Kalmido needs PostgreSQL 17
        # 2.707.0 (#5185): a short registry hang while docker run pulled the image failed this step in 20 s twice (runs
        # 40192975983, 42478203214) and held the live train. The image is pulled first, up to 3 tries with a growing pause;
        # a start that still fails prints the container log. Only the setup is retried - the ZAP finding itself stays hard.
        # tests/p2707_zap_db_start_test.py runs this script with a stand-in docker.
        run: |
          for try in 1 2 3; do
            docker pull -q postgres:17 && break
            if [ "$try" = 3 ]; then echo "::error::docker pull postgres:17 failed 3 times"; exit 1; fi
            echo "docker pull postgres:17 failed (try $try of 3), again in $((try * 10)) s"; sleep $((try * 10))
          done
          zapdb_log() { echo "::error::PostgreSQL for ZAP did not start"; docker logs kalmido-zap-db 2>&1 | tail -40 || true; exit 1; }
          docker run -d --name kalmido-zap-db -e POSTGRES_USER=kalmido -e POSTGRES_PASSWORD=zap -e POSTGRES_DB=kalmido \
            -e POSTGRES_INITDB_ARGS=--data-checksums postgres:17 -c max_connections=100 || zapdb_log
          # 2.715.0 (#5187): readiness over TCP, not the socket. The image first runs a setup server that listens on the
          # socket only and then restarts; a socket check saw that server as ready and the one final check met the restart
          # ("rejecting connections", run 42478203214). TCP answers only once the real server runs; the wait loop itself
          # is the final check, there is no second one-shot check that can fail in a gap.
          zapdb_ready=0
          for i in $(seq 1 90); do
            if docker exec kalmido-zap-db pg_isready -h 127.0.0.1 -U kalmido -d kalmido -q; then zapdb_ready=1; break; fi
            sleep 1
          done
          [ "$zapdb_ready" = 1 ] || zapdb_log
          echo "PostgreSQL for ZAP accepts TCP connections after $i s"
      # 2.180.0 A (#2692): the image of the job "image" (same key) when it is in the cache, else built here
      - name: Image key
        id: imgkey
        run: echo "key=kalmido-image-$(date -u +%G-%V)-${{ hashFiles('Dockerfile', 'tools/requirements.lock', 'tools/requirements.static.lock', 'app.py', 'VERSION', 'kalmido/**', 'static/**', 'folderwatch/**') }}" >> "$GITHUB_OUTPUT"
      - name: Image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: /tmp/kalmido-image
          key: ${{ steps.imgkey.outputs.key }}
      - name: Image (load, build on miss)
        run: |
          if [ -s /tmp/kalmido-image/kalmido-test.tar ] && docker load -i /tmp/kalmido-image/kalmido-test.tar \
             && docker image inspect kalmido:test >/dev/null; then
            echo "image loaded from the cache"
          else
            echo "image not in the cache (or not loadable) - building it"
            docker build -t kalmido:test .
          fi
          rm -rf /tmp/kalmido-image
      - name: Start Kalmido
        run: |
          mkdir -p /tmp/zapdata
          docker run -d --name kalmido-zap --user "$(id -u):$(id -g)" -e KALMIDO_UPDATE_CHECK=0 -e TASKS_DB=/data/tasks.db -e KALMIDO_NO_SECRET_KEY=1 \
            -e DATABASE_URL=postgresql://kalmido:zap@db:5432/kalmido --link kalmido-zap-db:db \
            -p 127.0.0.1:3040:3040 -v /tmp/zapdata:/data kalmido:test
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:3040/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3040/api/health || { docker logs kalmido-zap 2>&1 | tail -40; exit 1; }
      - name: ZAP baseline scan (unauthenticated)
        # the rule file is read from /zap/wrk (the mounted .zap folder); the container's user must be able to read it
        run: |
          chmod a+rx .zap && chmod a+r .zap/rules.tsv
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://127.0.0.1:3040/ -c rules.tsv

  install-upgrade:
    # 2.589.0 (#4359, audit #2480 finding 6): the way of a self-hoster, nightly and by hand only (a push never waits for it).
    # The release before this commit (the latest release, else the newest tag below VERSION with a release) is installed
    # with ITS install.sh from the GitHub release (prebuilt image pinned to the release digest), filled by
    # tests/upgrade_seed.py (one-time setup code from the log), updated to this commit with the update.sh the installer wrote
    # (KALMIDO_VERSION = the commit, KALMIDO_INSTALLER_URL = this commit's install.sh) and checked: version, sign-in, the
    # data as before, a write, the database copy of the update (tools/install_upgrade_check.py, tests/install_upgrade_verify.py).
    # The seeded old database is kept as an artifact: the quarterly fixture of tests/fixtures/upgrade/ (README there).
    name: Install the last release (install.sh), update to this commit (update.sh)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the release tags: the release to start from
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test dependencies (requests for the seed and the checks)
        run: pip install -r tests/requirements.txt
      - name: install.sh (last release) -> data -> update.sh (this commit) -> checks
        run: python3 tools/install_upgrade_check.py run --ref "$GITHUB_SHA" --dir "$RUNNER_TEMP/kalmido-install" --out "$RUNNER_TEMP/upgrade-fixture"
      - name: The old database (quarterly fixture for tests/fixtures/upgrade/)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-fixture
          path: ${{ runner.temp }}/upgrade-fixture
          if-no-files-found: ignore
          retention-days: 90
      - name: Installation log on failure
        if: failure()
        run: |
          cd "${{ runner.temp }}/kalmido-install" 2>/dev/null || exit 0
          cat .kalmido-version .kalmido-version.prev 2>/dev/null || true
          docker compose ps -a || true
          docker compose logs --no-color --tail 150 kalmido db || true

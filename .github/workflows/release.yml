name: Release

# A tag vX.Y.Z (pushed by the maintainer's export script) builds the multi-arch image, pushes it to
# ghcr.io/gegenschuss/kalmido:X.Y.Z and creates the GitHub release with the notes from CHANGELOG.md.
# 2.513.0 (#4354): both WITHOUT "latest": the image :latest and the "latest release" (which admins' update check, the installers and
# update.sh read) move only with promote.yml, after the device test of the live train passed.
# 2.277 (#2914): the release also carries the installers, the source archives and SHA256SUMS (with the image digest);
# kalmido.com/install.sh forwards to releases/latest/download/install.sh, the installer checks the archive and pins the
# image to the digest. 2.277 (#3054): the notes are made readable with tools/release_notes.py.
# 2.538.0 (#4360): the notes are highlights on top and stay below tools/release_notes.py MAX_CHARS (GitHub refuses over 125000).
# 2.309.0 (#3269): "the CI is the only gate" (#1315) - the job ci-gate waits for a green FULL run of the workflow CI on the
# tagged commit (tools/ci_gate.py); red, cancelled, only the push stage or no run = no image, no release.
# 2.360.2 (#2912): actions are pinned to commit hashes (Dependabot keeps them current, tests/p23602_a_api_test.py); only the job
# release may write packages and it runs third-party actions; only the job publish, without any action but download-artifact, may write contents.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci-gate:
    name: Wait for the green full CI of the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: CI of the tagged commit (tools/ci_gate.py)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci_gate.py --sha "$GITHUB_SHA" --timeout-min 240

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version from tag
        id: v
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          test "$(cat VERSION)" = "$ver" || { echo "VERSION file ($(cat VERSION)) does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: http/ {exit}
            on {print}' CHANGELOG.md > section.md
          python3 tools/release_notes.py section.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gegenschuss/kalmido:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.title=Kalmido
            org.opencontainers.image.description=Self-hosted task manager for households and small teams
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Release assets (installers, source archives, SHA256SUMS)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ver="${{ steps.v.outputs.version }}"
          mkdir dist
          git archive --format=tar.gz --prefix="kalmido-$ver/" -o "dist/kalmido-$ver.tar.gz" HEAD
          git archive --format=zip --prefix="kalmido-$ver/" -o "dist/kalmido-$ver.zip" HEAD
          cp install.sh install.ps1 dist/
          case "$DIGEST" in sha256:*) printf '%s\n' "$DIGEST" > dist/image-digest.txt ;; *) echo "no image digest"; exit 1 ;; esac
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Hand the assets to the job publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist
            notes.md
          retention-days: 1

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Kalmido ${{ needs.release.outputs.version }}" --notes-file notes.md --verify-tag --latest=false dist/*
          fi

name: Release

# A tag vX.Y.Z (pushed by the maintainer's export script) builds the multi-arch image and pushes it to
# ghcr.io/gegenschuss/kalmido:X.Y.Z. 2.641.0 (#5011): no GitHub release page per tag any more - weekly-release.yml makes ONE
# release per ISO week (on the tag vX.Y.Z of the newest version past the device test, with the notes of all versions since the last one and
# the assets below) and moves :latest; the image of every version stays (the live update and a way back pull :X.Y.Z).
# 2.513.0 (#4354): both WITHOUT "latest": the image :latest and the "latest release" (which admins' update check, the installers and
# update.sh read) move only with promote.yml, after the device test of the live train passed.
# 2.277 (#2914): the release also carries the installers, the source archives and SHA256SUMS (with the image digest);
# kalmido.com/install.sh forwards to releases/latest/download/install.sh, the installer checks the archive and pins the
# image to the digest. 2.277 (#3054): the notes are made readable with tools/release_notes.py.
# 2.538.0 (#4360): the notes are highlights on top and stay below tools/release_notes.py MAX_CHARS (GitHub refuses over 125000).
# 2.309.0 (#3269): "the CI is the only gate" (#1315) - the job ci-gate waits for a green FULL run of the workflow CI on the
# tagged commit (tools/ci_gate.py); red, cancelled, only the push stage or no run = no image, no release.
# 2.360.2 (#2912): actions are pinned to commit hashes (Dependabot keeps them current, tests/p23602_a_api_test.py); only the job
# release may write packages and it runs third-party actions; only the job publish, without any action but download-artifact, may write contents.
# 2.595.0 (#4905): workflow_dispatch on a tag re-runs the release once the CI of that tag (or of the same tree) is green,
# without moving or re-pushing the tag: gh workflow run release.yml --ref vX.Y.Z (any other ref is skipped).
# 2.610.0 (#4926): or by hand from any ref with the input tag vX.Y.Z (GitHub page) - after a soft red full CI of a tag was made green
# by a fix, the maintainer starts it on the newest green tag. The gate is the same: a green FULL run on the commit of that tag
# (tools/ci_gate.py, also a green run with the same file tree), the tag is never moved; the input reaches the shell only as env.
# 2.767.0 (#5324): the image follows the same rule as live - a finished full CI red only in SOFT suites passes
# too (all hard shards green, no red suite / job of tests/hard_suites.txt of the tagged tree; tools/ci_gate.py). Hard red, cancelled
# or only the push stage = no image as before. checks: read = the annotations naming the red suites; the soft red parts go into the
# step summary and, with ci_gate.py --report, into the notes of the weekly release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag vX.Y.Z whose full CI is green (empty = the tag the run was started on)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci-gate:
    name: Wait for the green full CI of the tagged commit
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: read
      actions: read
      checks: read  # 2.767.0 (#5324): the annotations "suite X failed" of a red shard
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      sha: ${{ steps.t.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag and commit (push of the tag, or the input of a start by hand)
        id: t
        env:
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$IN_TAG" ]; then
            tag="$IN_TAG"
            printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::input tag must be vX.Y.Z"; exit 1; }
            sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}") || { echo "::error::no tag $tag"; exit 1; }
          else
            tag="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$tag on $sha"
      - name: CI of the tagged commit (tools/ci_gate.py)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ steps.t.outputs.sha }}
        # 2.767.0 (#5324): the hard list and the test groups come from the TAGGED tree (a start by hand runs the gate of main)
        run: |
          set -euo pipefail
          git worktree add -q --detach "$RUNNER_TEMP/tagtree" "${TAG_SHA:-$GITHUB_SHA}"
          python3 tools/ci_gate.py --sha "${TAG_SHA:-$GITHUB_SHA}" --tree "$RUNNER_TEMP/tagtree" --timeout-min 240

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # 2.761.0 (#5218): the keyless Sigstore signature of the image (OIDC token of this run)
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - name: Version from tag
        id: v
        env:
          TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          ver="${TAG#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is no release tag vX.Y.Z"; exit 1; }  # 2.595.0 (#4905): dispatch on any v* ref
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          test "$(cat VERSION)" = "$ver" || { echo "VERSION file ($(cat VERSION)) does not match tag $TAG"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: http/ {exit}
            on {print}' CHANGELOG.md > section.md
          python3 tools/release_notes.py section.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gegenschuss/kalmido:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.title=Kalmido
            org.opencontainers.image.description=Self-hosted task manager for households and small teams
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      # 2.761.0 (#5218): code integrity stage 1b - a GitHub build attestation (Sigstore, keyless, public transparency log Rekor)
      # for the image digest just pushed: it states that this workflow of this repository built exactly this image from this
      # commit. Kept at GitHub (not pushed into the registry: no extra tags there, prune-releases.yml stays as it is).
      # Check: gh attestation verify oci://ghcr.io/gegenschuss/kalmido@sha256:... -R github.com/Gegenschuss/kalmido (SECURITY.md).
      - name: Attest the image (Sigstore, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gegenschuss/kalmido
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

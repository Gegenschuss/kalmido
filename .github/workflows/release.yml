name: Release

# A tag vX.Y.Z (pushed by the maintainer's export script) builds the multi-arch image, pushes it to
# ghcr.io/gegenschuss/kalmido:X.Y.Z and :latest and creates the GitHub release with the notes from
# CHANGELOG.md. Admins' update check reads that release.
# 2.277 (#2914): the release also carries the installers, the source archives and SHA256SUMS (with the image digest);
# kalmido.com/install.sh forwards to releases/latest/download/install.sh, the installer checks the archive and pins the
# image to the digest. 2.277 (#3054): the notes are made readable with tools/release_notes.py.
# 2.309.0 (#3269): "the CI is the only gate" (#1315) - the job ci-gate waits for a green FULL run of the workflow CI on the
# tagged commit (tools/ci_gate.py); red, cancelled, only the push stage or no run = no image, no :latest, no release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  ci-gate:
    name: Wait for the green full CI of the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: CI of the tagged commit (tools/ci_gate.py)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci_gate.py --sha "$GITHUB_SHA" --timeout-min 240

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: v
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          test "$(cat VERSION)" = "$ver" || { echo "VERSION file ($(cat VERSION)) does not match tag $GITHUB_REF_NAME"; exit 1; }
          # 2.285.0 (#2830): a fast-lane patch (tag on a hotfix branch, e.g. 2.166.5 after 2.223.1 is tagged) is not the
          # newest version: it keeps the GitHub release "latest" and the image tag :latest on the highest version
          top=$(git ls-remote --tags --refs origin 'v*.*.*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest=true
          if [ -n "$top" ] && [ "$top" != "$ver" ] && [ "$(printf '%s\n%s\n' "$top" "$ver" | sort -V | tail -1)" = "$top" ]; then
            latest=false; echo "::notice title=not latest::$ver is below the newest tag v$top - no :latest, release not marked latest"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: http/ {exit}
            on {print}' CHANGELOG.md > section.md
          python3 tools/release_notes.py section.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gegenschuss/kalmido:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && 'ghcr.io/gegenschuss/kalmido:latest' || '' }}
          labels: |
            org.opencontainers.image.title=Kalmido
            org.opencontainers.image.description=Self-hosted task manager for households and small teams
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Release assets (installers, source archives, SHA256SUMS)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ver="${{ steps.v.outputs.version }}"
          mkdir dist
          git archive --format=tar.gz --prefix="kalmido-$ver/" -o "dist/kalmido-$ver.tar.gz" HEAD
          git archive --format=zip --prefix="kalmido-$ver/" -o "dist/kalmido-$ver.zip" HEAD
          cp install.sh install.ps1 dist/
          case "$DIGEST" in sha256:*) printf '%s\n' "$DIGEST" > dist/image-digest.txt ;; *) echo "no image digest"; exit 1 ;; esac
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Kalmido ${{ steps.v.outputs.version }}" --notes-file notes.md --verify-tag --latest="${{ steps.v.outputs.latest }}" dist/*
          fi

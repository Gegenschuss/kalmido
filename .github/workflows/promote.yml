name: Promote

# 2.513.0 (#4354): the second step of a release. release.yml builds the image :X.Y.Z; the live train pushes the tag latest-ok/X.Y.Z
# (on the commit of vX.Y.Z, tags are never moved) only after "device test ok" and a healthy live update. A blocker or "not testable"
# = no tag, latest stays on the state of before.
# 2.641.0 (#5011): "latest" moves only with the weekly release (weekly-release.yml: the image :latest and the latest release
# together, once per ISO week). This workflow only checks at once that the tag can be picked there: latest-ok/X.Y.Z is on the
# commit of vX.Y.Z and the image :X.Y.Z with a usable digest is there (release.yml may still be building it). It writes nothing.
# No third-party action runs here.
on:
  push:
    tags: ["latest-ok/*.*.*"]

permissions:
  contents: read

jobs:
  promote:
    name: Check the tag and the image (latest moves with the weekly release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#latest-ok/}"
          printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$GITHUB_REF_NAME names no version"; exit 1; }
          tag="v$ver"
          have=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
          [ "$have" = "$GITHUB_SHA" ] || { echo "::error::$GITHUB_REF_NAME is on $GITHUB_SHA, $tag on $have"; exit 1; }
          # release.yml may still be building the image
          i=0
          until digest=$(docker buildx imagetools inspect "ghcr.io/gegenschuss/kalmido:$ver" --format '{{.Manifest.Digest}}' 2>/dev/null); do
            i=$((i + 1))
            [ "$i" -lt 100 ] || { echo "::error::image :$ver not there after 50 minutes"; exit 1; }
            sleep 30
          done
          digest=$(printf '%s' "$digest" | tr -d '[:space:]')
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no usable image digest: $digest"; exit 1; }
          echo "::notice title=ready for the weekly release::$tag ($digest) - weekly-release.yml makes it latest on Sunday or when started by hand"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#16171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kalmido">
<title>Kalmido</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180">
<link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<button id="skip" class="skip" type="button">Skip to content</button>
<div id="app">
  <aside id="side" tabindex="-1"></aside>
  <main id="main">
    <header id="top"></header>
    <div id="view"></div>
  </main>
  <section id="detail" class="hidden"></section>
  <nav id="tabs"></nav>
  <button id="fab" aria-label="New task"></button>
  <div id="scrim" class="hidden"></div>
  <div id="pop" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="srlive" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>

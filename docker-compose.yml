# 2.239.0 B (#2888): container logs rotate (3 files of 10 MB per service) instead of growing forever; the server log holds
# shortened addresses and account numbers only. For fail2ban use driver journald here (docs/SELF-HOSTING.md "fail2ban").
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  kalmido:
    build: .
    # kalmido:local = built from this folder; KALMIDO_IMAGE=ghcr.io/gegenschuss/kalmido:<version> in .env
    # uses the prebuilt image instead (docker compose pull && docker compose up -d)
    image: ${KALMIDO_IMAGE:-kalmido:local}
    container_name: kalmido
    logging: *logging
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # 2.182.0 (#2716): the image is read-only; Kalmido writes only to /data, /secret and /tmp (below)
    read_only: true
    env_file: .env
    environment:
      # 2.37.0: the data lives in PostgreSQL (service "db" below). An own / managed server instead: set DATABASE_URL in
      # .env and leave "localdb" out of COMPOSE_PROFILES there (docs/SELF-HOSTING.md). Use letters and digits for the password.
      DATABASE_URL: ${DATABASE_URL:-postgresql://kalmido:${POSTGRES_PASSWORD}@db:5432/kalmido}
      # 2.45.0: without KALMIDO_SECRET_KEY in .env the server key is created once in this file (own folder ./secret,
      # never inside ./data: a backup must not carry the key next to the data it protects). Keep a copy of it.
      KALMIDO_SECRET_FILE: ${KALMIDO_SECRET_FILE:-/secret/kalmido.key}
      # 2.61.0: uploads are scanned by the virus scanner (service "clamav" below). Switch it off on small servers: set
      # KALMIDO_CLAMD= (empty) in .env and leave "clamav" out of COMPOSE_PROFILES there (docs/SELF-HOSTING.md "Virus scan of uploads")
      KALMIDO_CLAMD: ${KALMIDO_CLAMD-clamav:3310}
      # 2.223.3 (#2877): the deletion runs (trash after its period, old logs, old safety backups, orphan files). 0 = they only
      # count what they would delete (Administration > Server shows it); 1 = they delete for good. The installer writes 1
      # into a new .env; an existing installation keeps 0 until its admin switches it on (docs/ENV.md)
      KALMIDO_RETENTION_PURGE: ${KALMIDO_RETENTION_PURGE:-0}
    depends_on:
      db:
        condition: service_healthy
        # 2.149.0 D (#2510): only while the profile "localdb" is on (Compose 2.20 or newer)
        required: false
    volumes:
      # attachments, backups, office files; an old tasks.db here moves to PostgreSQL on the first start of 2.37
      - ./data:/data
      # the server key (see KALMIDO_SECRET_FILE above); create the folder yourself (mkdir secret) so the container can write it
      - ./secret:/secret
      # 2.182.0 (#2716): scratch space (text recognition, ZIP downloads up to 1 GB, database dumps) on disk, not in memory
      - kalmido-tmp:/tmp
    healthcheck:
      # 2.45.0: python3 is in the image (no curl); "docker compose ps" shows healthy / unhealthy
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('PORT', '3040'), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      # Built-in login by default (setup page on the first start, with the one-time code from
      # "docker compose logs kalmido"). Keep it on localhost behind a
      # reverse proxy with HTTPS for use outside your network.
      - "127.0.0.1:3040:3040"
      # Single sign-on via a trusted proxy header (see .env.example / README): map the proxy port
      # only to the address your proxy connects to, e.g. instead of the line above:
      # - "127.0.0.1:3040:3045"
    # 2.59.0 (#1375): "default" + the internal network of the optional embedding service (below)
    networks: [default, embed]

  db:
    # PostgreSQL 17 (2.37.0). Stay on 17 when updating; a new major version needs a dump + restore (docs/SELF-HOSTING.md).
    # 2.149.0 D (#2510): runs with the profile "localdb" (COMPOSE_PROFILES in .env; the installer writes the line). An own
    # database server: DATABASE_URL in .env and "localdb" left out of COMPOSE_PROFILES. Updates never bring it back.
    image: postgres:17
    container_name: kalmido-db
    logging: *logging
    profiles: ["localdb"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: kalmido
      POSTGRES_DB: kalmido
      # set in .env (e.g. openssl rand -hex 24); only read when the database folder is created
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # page checksums: damaged pages are reported instead of read silently
      POSTGRES_INITDB_ARGS: --data-checksums
    # Kalmido keeps up to 56 connections (KALMIDO_DB_POOL_MAX); the server must allow more
    command: ["postgres", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalmido -d kalmido"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    # time for a clean shutdown (no recovery on the next start)
    stop_grace_period: 60s
    volumes:
      # the database files; no port is published, only Kalmido reaches the database
      - ./pgdata:/var/lib/postgresql/data

  # 2.59.0 (#1375): optional -- "Related tasks" (similar tasks in a task, a hint on likely duplicates while adding, "also similar
  # meaning" in the search). A small local embedding model on your CPU turns task texts into numbers; it writes no text and
  # sends nothing anywhere. Start it with: docker compose --profile embed up -d --build
  # and set KALMIDO_EMBED_URL=http://embed:8090 in .env (then restart kalmido). About 0.5 GB image, ~0.6 GB RAM, one CPU thread.
  # Without it (the default) Kalmido works as before and hides the related tasks.
  embed:
    build: ./embed
    image: kalmido-embed:local
    container_name: kalmido-embed
    logging: *logging
    profiles: ["embed"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    # no published port: only Kalmido reaches it, over the internal network (no way out to the internet)
    networks: [embed]
  clamav:
    # 2.61.0: ClamAV checks every upload before it is stored (about 1-1.5 GB RAM). freshclam inside the container updates the
    # signatures by itself. Not reachable (e.g. still loading after a start): uploads are taken, marked "Unchecked" and
    # checked once it runs. Without it: KALMIDO_CLAMD= in .env and leave "clamav" out of COMPOSE_PROFILES there
    # (2.149.0 D, #2510: a profile instead of deleting this block - updates replace this file and kept bringing it back).
    image: clamav/clamav:1.4
    container_name: kalmido-clamav
    logging: *logging
    profiles: ["clamav"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    volumes:
      # the signatures (a named volume, kept across restarts: no full download on every start); no port is published
      - clamav-db:/var/lib/clamav

networks:
  embed:
    internal: true

volumes:
  clamav-db:
  kalmido-tmp:
